<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alfred Gadget - Browse quality products with a clean, modern interface">
    <title>Alfred Gadget - Browse Products</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Restructured layout to match wireframe with logo, search, sidebar, content, and footer -->
    <!-- Navigation -->
    <nav id="navbar" class="navbar" role="navigation" aria-label="Main navigation">
        <!-- Navbar will be rendered by Navbar.js -->
    </nav>

    <!-- Sidebar will be rendered by Sidebar.js -->
    <aside id="sidebar-container">
        <!-- Sidebar component renders here -->
    </aside>

    <!-- Main Content Wrapper -->
    <div class="page-wrapper">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Product Grid -->
            <section id="product-grid" class="product-grid-container" aria-label="Product listing">
                <!-- Loading state -->
                <div id="loading" class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading products...</p>
                </div>

                <!-- Error state -->
                <div id="error" class="error-state hidden">
                    <p class="error-message"></p>
                    <button class="retry-button">Retry</button>
                </div>

                <!-- Product grid will be rendered by ProductGrid.js -->
                <div id="products" class="product-grid"></div>
            </section>
        </main>

        <!-- Footer will be rendered by Footer.js -->
        <footer id="footer-container" class="footer">
            <!-- Footer component renders here -->
        </footer>
    </div>
    <!-- </CHANGE> -->

    <!-- Main JS Entry Point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
